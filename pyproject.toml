[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rho-aif"
version = "1.0.0"
description = "Expected Free Energy as belief-dependent utility for rho-POMDPs: agents, environments, and a benchmark suite for information-gathering planning"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Patrick Cooper", email = "patrick.cooper@colorado.edu" },
    { name = "Alvaro Velasquez", email = "alvaro.velasquez@colorado.edu" },
]
keywords = [
    "active inference",
    "expected free energy",
    "POMDP",
    "rho-POMDP",
    "epistemic value",
    "information gain",
    "benchmark",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "gymnasium>=0.29.0",
    "inferactively-pymdp>=0.0.7",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
rho-aif-bench = "rho_aif.cli:main"

[project.urls]
Repository = "https://github.com/PatrickAllenCooper/rho_aif"
Homepage = "https://github.com/PatrickAllenCooper/rho_aif"

[tool.setuptools.packages.find]
include = ["rho_aif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
